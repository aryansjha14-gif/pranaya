name: Build APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true

      - name: Scaffold the Android host project
        run: |
          flutter create --platforms=android --org ai.pranaya --project-name pranaya /tmp/scaffold
          cp -r /tmp/scaffold/android ./android

      - name: Draw the launcher icons
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow
          python3 tool/make_icons.py

      - name: Patch Android config
        run: python3 tool/patch_android.py

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v -keystore android/app/pranaya-release.jks -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 -alias pranaya \
            -storepass pranaya2026 -keypass pranaya2026 \
            -dname "CN=Pranaya, OU=Mobile, O=Pranaya, L=Delhi, ST=Delhi, C=IN"
          printf 'storePassword=pranaya2026\nkeyPassword=pranaya2026\nkeyAlias=pranaya\nstoreFile=pranaya-release.jks\n' > android/key.properties

      - name: Dependencies and static analysis
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Collect outputs
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/pranaya-2.0.0.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/pranaya-2.0.0.aab
          cp android/app/pranaya-release.jks dist/pranaya-release.jks

      - uses: actions/upload-artifact@v4
        with:
          name: pranaya-binaries
          path: dist/*

      - name: Publish release with binaries
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pranaya build ${{ github.run_number }}
          body: |
            Built automatically by GitHub Actions from main.

            Files:
            - pranaya-2.0.0.apk - install this on an Android phone
            - pranaya-2.0.0.aab - upload this to Google Play
            - pranaya-release.jks - the signing key these were signed with

            Keystore details: store password `pranaya2026`, key alias `pranaya`,
            key password `pranaya2026`. Keep the .jks file safe.
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
